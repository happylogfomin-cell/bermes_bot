<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BERM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #14141f;
            color: #e8e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 14px 14px 100px 14px;
            overflow-x: hidden;
            letter-spacing: -0.3px;
        }

        /* Баланс — просто, без плашки */
        .balance-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 6px 0 18px 0;
            font-size: 17px;
            font-weight: 600;
            color: #ffcb3d;
        }
        .balance-row .coin { font-size: 20px; }

        /* LIVE — лента без обводок */
        .live-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 14px 2px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .live-strip::-webkit-scrollbar { display: none; }
        .live-chip {
            min-width: 54px;
            height: 54px;
            background: #1d1d2e;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border: 1px solid #262640;
        }

        /* Карточки игр */
        .game {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 18px;
            border-radius: 22px;
            margin-bottom: 12px;
            cursor: pointer;
            border: none;
            color: #fff;
            text-align: left;
            font-family: inherit;
            width: 100%;
            box-shadow: 0 6px 0 rgba(0,0,0,0.25);
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .game:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 rgba(0,0,0,0.25);
        }

        /* Лёгкие повороты — чтобы не выглядело шаблонно */
        .game:nth-child(odd)  { transform: rotate(-0.4deg); }
        .game:nth-child(even) { transform: rotate(0.3deg); }

        .game-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(0,0,0,0.18);
            border-radius: 14px;
        }
        .game-icon svg { width: 32px; height: 32px; }

        .game-text { flex: 1; min-width: 0; }
        .game-title {
            font-size: 22px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 3px;
        }
        .game-sub {
            font-size: 13.5px;
            opacity: 0.8;
            font-weight: 500;
        }

        .badge-live {
            display: inline-block;
            background: rgba(0,0,0,0.25);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* Цвета — приглушённые */
        .c-crash     { background: #2f5bb7; }
        .c-contracts { background: #6a3fbf; }
        .c-mines     { background: #c42e46; }
        .c-eggs      { background: #25a660; }
        .c-pvp       { background: #d4842a; }
        .c-slots     { background: #2a2a3d; }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            display: flex;
            justify-content: space-around;
            background: #1a1a28;
            padding: 8px 0 14px 0;
            border-top: 1px solid #262638;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10.5px;
            color: #6b6b80;
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            font-family: inherit;
            font-weight: 600;
            padding: 4px 6px;
        }
        .nav-item.active { color: #ffcb3d; }
        .nav-item svg { width: 22px; height: 22px; }
        .nav-badge {
            position: absolute;
            top: -2px; right: 0;
            background: #d92e4b;
            color: #fff;
            border-radius: 8px;
            padding: 1px 5px;
            font-size: 9.5px;
            font-weight: 800;
        }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; }
        .screen-title {
            font-size: 26px;
            font-weight: 800;
            margin: 20px 0 10px 0;
        }
        .screen-sub { color: #8a8a9c; font-size: 14px; margin-bottom: 20px; }
        .back-btn {
            background: #262638;
            color: #e8e8f0;
            border: none;
            padding: 12px 22px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <!-- Баланс -->
    <div class="balance-row">
        <span class="coin">⭐</span>
        <span id="balance">0</span>
    </div>

    <!-- ЭКРАН: Игры -->
    <div id="screen-games" class="screen active">
        <div class="live-strip">
            <div class="live-chip">🎁</div>
            <div class="live-chip">💎</div>
            <div class="live-chip">🔴</div>
            <div class="live-chip">🚀</div>
            <div class="live-chip">🔥</div>
            <div class="live-chip">⭐</div>
        </div>

        <button class="game c-crash" onclick="go('crash')">
            <div class="game-icon">
                <svg viewBox="0 0 24 24" fill="white"><path d="M12 2L4 14h6l-1 8 8-12h-6l1-8z"/></svg>
            </div>
            <div class="game-text">
                <div class="game-title">Краш</div>
                <span class="badge-live">Онлайн</span>
            </div>
        </button>

        <button class="game c-contracts" onclick="go('contracts')">
            <div class="game-icon">
                <svg viewBox="0 0 24 24" fill="white"><path d="M6 2h9l5 5v15H6V2zm9 1.5V7h3.5L15 3.5zM8 11h8v1.5H8V11zm0 3.5h8V16H8v-1.5z"/></svg>
            </div>
            <div class="game-text">
                <div class="game-title">Контракты</div>
                <div class="game-sub">Объедините подарки</div>
            </div>
        </button>

        <button class="game c-mines" onclick="go('mines')">
            <div class="game-icon">
                <svg viewBox="0 0 24 24" fill="white"><circle cx="12" cy="14" r="6"/><rect x="11" y="3" width="2" height="4"/><path d="M17 5l1.5-1.5 1 1L18 6z"/></svg>
            </div>
            <div class="game-text">
                <div class="game-title">Мины</div>
                <div class="game-sub">Угадайте верную ячейку</div>
            </div>
        </button>

        <button class="game c-eggs" onclick="go('eggs')">
            <div class="game-icon">
                <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C8 2 5 8 5 13a7 7 0 0 0 14 0c0-5-3-11-7-11z"/></svg>
            </div>
            <div class="game-text">
                <div class="game-title">Яйца</div>
                <div class="game-sub">6 кейсов</div>
            </div>
        </button>

        <button class="game c-pvp" onclick="go('pvp')">
            <div class="game-icon">
                <svg viewBox="0 0 24 24" fill="white"><path d="M3 3l4 4-1.5 1.5L2 5V3h1zm18 0v2l-3.5 3.5L16 7l4-4h1zM5 19l4-4 1.5 1.5L7 20H5v-1zm14 1h-2l-3.5-3.5L15 15l4 4v1z"/></svg>
            </div>
            <div class="game-text">
                <div class="game-title">PvP</div>
                <span class="badge-live">Онлайн</span>
            </div>
        </button>

        <button class="game c-slots" onclick="go('slots')">
            <div class="game-icon">
                <svg viewBox="0 0 24 24" fill="white"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="white" stroke-width="2"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/></svg>
            </div>
            <div class="game-text">
                <div class="game-title">Слоты</div>
                <div class="game-sub">5 кейсов</div>
            </div>
        </button>
    </div>

    <!-- Экраны игр (пока заглушки) -->
    <div id="screen-crash" class="screen">
        <div class="screen-title">🚀 Краш</div>
        <div class="screen-sub">Здесь будет график множителя.</div>
        <button class="back-btn" onclick="go('games')">← Назад</button>
    </div>
    <div id="screen-contracts" class="screen">
        <div class="screen-title">📜 Контракты</div>
        <div class="screen-sub">Объединение подарков.</div>
        <button class="back-btn" onclick="go('games')">← Назад</button>
    </div>
    <div id="screen-mines" class="screen">
        <div class="screen-title">💣 Мины</div>
        <div class="screen-sub">Поле 5×5 скоро здесь.</div>
        <button class="back-btn" onclick="go('games')">← Назад</button>
    </div>
    <div id="screen-eggs" class="screen">
        <div class="screen-title">🥚 Яйца</div>
        <div class="screen-sub">6 кейсов с подарками.</div>
        <button class="back-btn" onclick="go('games')">← Назад</button>
    </div>
    <div id="screen-pvp" class="screen">
        <div class="screen-title">⚔️ PvP</div>
        <div class="screen-sub">Игра 1 на 1 — скоро.</div>
        <button class="back-btn" onclick="go('games')">← Назад</button>
    </div>
    <div id="screen-slots" class="screen">
        <div class="screen-title">🎰 Слоты 777</div>
        <div class="screen-sub">Крутите барабаны — скоро.</div>
        <button class="back-btn" onclick="go('games')">← Назад</button>
    </div>
    <div id="screen-profile" class="screen">
        <div class="screen-title">👤 Профиль</div>
        <div class="screen-sub">ID: <span id="uid">—</span></div>
        <button class="back-btn" onclick="go('games')">← Назад</button>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="nav('games', this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h10a5 5 0 0 1 5 5v2a5 5 0 0 1-5 5h-1l-1-2h-6l-1 2H7a5 5 0 0 1-5-5v-2a5 5 0 0 1 5-5zm2 4v2H7v-2h2zm8 0h-2v2h2v-2z"/></svg>
            <span>Игры</span>
        </button>
        <button class="nav-item" onclick="nav('contests', this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14v3a4 4 0 0 1-4 4h-1v2a3 3 0 0 0 3 3h1v3H6v-3h1a3 3 0 0 0 3-3V10H9a4 4 0 0 1-4-4V3z"/></svg>
            <span class="nav-badge">1</span>
            <span>Конкурсы</span>
        </button>
        <button class="nav-item" onclick="nav('tasks', this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>
            <span class="nav-badge">7</span>
            <span>Задания</span>
        </button>
        <button class="nav-item" onclick="nav('tournament', this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l4 4-1.5 1.5L3 6V4h1zm16 0v2l-3.5 3.5L15 8l4-4h1zM6 20l4-4 1.5 1.5L8 21H6v-1zm12 1h-2l-3.5-3.5L14 16l4 4v1z"/></svg>
            <span>Турнир</span>
        </button>
        <button class="nav-item" onclick="nav('profile', this)">
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7v1H4v-1z"/></svg>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe?.user) {
            document.getElementById('uid').innerText = tg.initDataUnsafe.user.id;
        }
        document.getElementById('balance').innerText = "10 000";

        function go(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            window.scrollTo(0, 0);
        }

        function nav(id, el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            if (id === 'games') { go('games'); return; }
            if (id === 'profile') { go('profile'); return; }
            alert('Раздел "' + id + '" — скоро!');
        }
    </script>
</body>
</html>
