<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BERM Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0f0f1e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            padding: 12px 12px 90px 12px;
            overflow-x: hidden;
        }

        /* Шапка с балансом */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #1a1a2e;
            border-radius: 50px;
            padding: 10px 20px;
            margin-bottom: 16px;
        }
        .balance {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }
        .plus-btn {
            background: #2a9df4;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Блок LIVE */
        .live-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 16px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .live-row::-webkit-scrollbar { display: none; }
        .live-item {
            min-width: 50px;
            height: 50px;
            background: #252540;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Кнопки игр */
        .game-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            border: none;
            color: #fff;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
        }
        .game-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }
        .game-info { flex: 1; }
        .game-title { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .game-sub { font-size: 14px; opacity: 0.75; }

        /* Градиенты под каждую игру */
        .g-blue    { background: linear-gradient(135deg, #1e3c72, #2a5298); }
        .g-purple  { background: linear-gradient(135deg, #7b2ff7, #a855f7); }
        .g-red     { background: linear-gradient(135deg, #c31432, #e94560); }
        .g-green   { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .g-orange  { background: linear-gradient(135deg, #f2994a, #f2c94c); }
        .g-dark    { background: linear-gradient(135deg, #232526, #414345); }

        /* Плашка ОНЛАЙН */
        .badge-online {
            background: rgba(255,255,255,0.2);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 6px;
        }

        /* Нижнее меню */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            background: #1a1a2e;
            padding: 10px 0 15px 0;
            border-top: 1px solid #252540;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #888;
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            font-family: inherit;
        }
        .nav-item.active { color: #2a9df4; }
        .nav-icon { font-size: 22px; }
        .nav-badge {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #e94560;
            color: #fff;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 10px;
            font-weight: bold;
        }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; }
        .back-btn {
            background: #252540;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            margin-top: 20px;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <span class="balance">⭐ <span id="balance">0</span></span>
        <button class="plus-btn" onclick="alert('Пополнение через звёзды — скоро')">+</button>
    </div>

    <!-- ЭКРАН: Игры -->
    <div id="screen-games" class="screen active">
        <div class="live-row">
            <div class="live-item">🎁</div>
            <div class="live-item">💎</div>
            <div class="live-item">🔴</div>
            <div class="live-item">🚀</div>
            <div class="live-item">🔥</div>
        </div>

        <button class="game-btn g-blue" onclick="showScreen('crash')">
            <div class="game-icon">🚀</div>
            <div class="game-info">
                <div class="game-title">Краш</div>
                <div class="badge-online">Онлайн</div>
            </div>
        </button>

        <button class="game-btn g-purple" onclick="showScreen('contracts')">
            <div class="game-icon">📜</div>
            <div class="game-info">
                <div class="game-title">Контракты</div>
                <div class="game-sub">Объедините подарки</div>
            </div>
        </button>

        <button class="game-btn g-red" onclick="showScreen('mines')">
            <div class="game-icon">💣</div>
            <div class="game-info">
                <div class="game-title">Мины</div>
                <div class="game-sub">Угадайте верную ячейку</div>
            </div>
        </button>

        <button class="game-btn g-green" onclick="showScreen('eggs')">
            <div class="game-icon">🥚</div>
            <div class="game-info">
                <div class="game-title">Яйца</div>
                <div class="game-sub">6 кейсов</div>
            </div>
        </button>

        <button class="game-btn g-orange" onclick="showScreen('pvp')">
            <div class="game-icon">⚔️</div>
            <div class="game-info">
                <div class="game-title">PvP</div>
                <div class="badge-online">Онлайн</div>
            </div>
        </button>

        <button class="game-btn g-dark" onclick="showScreen('slots')">
            <div class="game-icon">🎰</div>
            <div class="game-info">
                <div class="game-title">Слоты</div>
                <div class="game-sub">5 кейсов</div>
            </div>
        </button>
    </div>

    <!-- ЭКРАН: Краш -->
    <div id="screen-crash" class="screen">
        <h2 style="margin:20px 0;">🚀 Краш</h2>
        <p>Здесь будет график с ростом множителя.</p>
        <button class="back-btn" onclick="showScreen('games')">← Назад</button>
    </div>

    <!-- ЭКРАН: Контракты -->
    <div id="screen-contracts" class="screen">
        <h2 style="margin:20px 0;">📜 Контракты</h2>
        <p>Объединение подарков.</p>
        <button class="back-btn" onclick="showScreen('games')">← Назад</button>
    </div>

    <!-- ЭКРАН: Мины -->
    <div id="screen-mines" class="screen">
        <h2 style="margin:20px 0;">💣 Мины</h2>
        <p>Поле 5×5 скоро здесь.</p>
        <button class="back-btn" onclick="showScreen('games')">← Назад</button>
    </div>

    <!-- ЭКРАН: Яйца -->
    <div id="screen-eggs" class="screen">
        <h2 style="margin:20px 0;">🥚 Яйца</h2>
        <p>6 кейсов с подарками.</p>
        <button class="back-btn" onclick="showScreen('games')">← Назад</button>
    </div>

    <!-- ЭКРАН: PvP -->
    <div id="screen-pvp" class="screen">
        <h2 style="margin:20px 0;">⚔️ PvP</h2>
        <p>Игра 1 на 1 — скоро.</p>
        <button class="back-btn" onclick="showScreen('games')">← Назад</button>
    </div>

    <!-- ЭКРАН: Слоты -->
    <div id="screen-slots" class="screen">
        <h2 style="margin:20px 0;">🎰 Слоты 777</h2>
        <p>Крутите барабаны — скоро.</p>
        <button class="back-btn" onclick="showScreen('games')">← Назад</button>
    </div>

    <!-- ЭКРАН: Профиль -->
    <div id="screen-profile" class="screen">
        <h2 style="margin:20px 0;">👤 Профиль</h2>
        <p>Твой ID: <span id="user-id">—</span></p>
        <button class="back-btn" onclick="showScreen('games')">← Назад</button>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="navTo('games', this)">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </button>
        <button class="nav-item" onclick="navTo('contests', this)">
            <span class="nav-icon">🏆</span>
            <span class="nav-badge">1</span>
            <span>Конкурсы</span>
        </button>
        <button class="nav-item" onclick="navTo('tasks', this)">
            <span class="nav-icon">🎯</span>
            <span class="nav-badge">7</span>
            <span>Задания</span>
        </button>
        <button class="nav-item" onclick="navTo('tournament', this)">
            <span class="nav-icon">⚔️</span>
            <span>Турнир</span>
        </button>
        <button class="nav-item" onclick="navTo('profile', this)">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Показываем ID пользователя
        if (tg.initDataUnsafe?.user) {
            document.getElementById('user-id').innerText = tg.initDataUnsafe.user.id;
            // TODO: запрос к серверу за балансом
            document.getElementById('balance').innerText = "10 000";
        } else {
            document.getElementById('balance').innerText = "10 000";
        }

        // Переключение экранов
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            window.scrollTo(0, 0);
        }

        // Нижнее меню
        function navTo(id, el) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            // Заглушки для не-игровых экранов
            if (id === 'games') { showScreen('games'); return; }
            if (id === 'profile') { showScreen('profile'); return; }
            alert('Раздел "' + id + '" — скоро!');
        }
    </script>
</body>
</html>
