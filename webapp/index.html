<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BERM Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 0 0 100px 0;
            overflow-x: hidden;
            letter-spacing: -0.2px;
        }

        /* Верхняя панель с балансом */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #0a0a0f;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .balance-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1a24;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
        }
        .balance-pill .coin {
            background: #c9922a;
            border-radius: 50%;
            width: 22px; height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            font-weight: 900;
        }
        .user-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1a24;
            padding: 6px 14px 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
        }
        .user-avatar {
            width: 26px; height: 26px;
            background: #c9922a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 900;
        }

        /* Поиск */
        .search-row {
            display: flex;
            gap: 10px;
            padding: 0 16px 16px 16px;
        }
        .search-input {
            flex: 1;
            background: #1a1a24;
            border: none;
            border-radius: 14px;
            padding: 12px 16px 12px 42px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4-4'/></svg>");
            background-repeat: no-repeat;
            background-position: 14px center;
        }
        .search-input::placeholder { color: #555; }
        .search-btn {
            background: #1a1a24;
            color: #bbb;
            border: none;
            border-radius: 14px;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Заголовки секций */
        .section-title {
            padding: 12px 16px 14px 16px;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .emoji { font-size: 22px; }

        /* Горизонтальный скролл игр */
        .games-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 16px 20px 16px;
            scrollbar-width: none;
        }
        .games-row::-webkit-scrollbar { display: none; }

        .game-card {
            min-width: 100px;
            background: #14141d;
            border-radius: 18px;
            padding: 8px 8px 12px 8px;
            text-align: center;
            cursor: pointer;
            border: none;
            color: #fff;
            font-family: inherit;
            position: relative;
            flex-shrink: 0;
        }
        .game-badge {
            position: absolute;
            top: 8px; left: 8px;
            background: #2a2a35;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .game-badge .fire { color: #ff6b35; }
        .game-badge.fast { background: #2a2a35; }
        .game-badge.luck { background: #2a2a35; }

        .game-emoji {
            font-size: 44px;
            line-height: 1;
            margin: 22px 0 8px 0;
            display: block;
        }
        .game-name {
            font-size: 14px;
            font-weight: 700;
        }
        .game-type {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }

        /* Список мини-игр (2 колонки) */
        .mini-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 16px 20px 16px;
        }
        .mini-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #14141d;
            border: none;
            border-radius: 16px;
            padding: 12px 14px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
        }
        .mini-item .ico { font-size: 24px; }
        .mini-item .arrow {
            margin-left: auto;
            color: #555;
            font-size: 16px;
        }

        /* Широкие карточки (PvP, Блэкджек) */
        .wide-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #14141d;
            border-radius: 18px;
            padding: 14px 16px;
            margin: 0 16px 10px 16px;
            cursor: pointer;
            color: #fff;
            font-family: inherit;
            border: none;
            width: calc(100% - 32px);
            text-align: left;
        }
        .wide-card .ico { font-size: 30px; }
        .wide-card .info { flex: 1; }
        .wide-card .title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
        .wide-card .sub { font-size: 12px; color: #777; }
        .wide-card .arrow { color: #555; font-size: 18px; }

        /* Нижнее меню с большой кнопкой */
        .bottom-nav {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #1a1a24;
            border-radius: 30px;
            padding: 12px 8px;
            border: 1px solid #25252f;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .nav-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 22px;
            padding: 8px;
            cursor: pointer;
        }
        .nav-btn.active { color: #fff; }
        .nav-btn.center {
            background: linear-gradient(135deg, #c9922a, #a87a1e);
            width: 56px; height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -22px;
            box-shadow: 0 6px 16px rgba(201, 146, 42, 0.5);
            color: #fff;
            font-size: 26px;
        }

        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; }
        .back-btn {
            margin: 20px 16px;
            background: #1a1a24;
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель -->
    <div class="top-bar">
        <div class="balance-pill">
            <span class="coin">$</span>
            <span id="balance">3 045 810,31</span>
        </div>
        <div class="user-pill">
            <span id="username">Игрок</span>
            <div class="user-avatar" id="user-avatar">P</div>
        </div>
    </div>

    <!-- Главный экран -->
    <div id="screen-games" class="screen active">

        <!-- Поиск -->
        <div class="search-row">
            <input class="search-input" placeholder="Найти игру" />
            <button class="search-btn">Поиск</button>
        </div>

        <!-- Популярные за 24 часа -->
        <div class="section-title"><span class="emoji">🔥</span> Популярные игры за 24 часа</div>
        <div class="games-row">
            <button class="game-card" onclick="go('dice')">
                <div class="game-badge"><span class="fire">🔥</span> Популярное</div>
                <span class="game-emoji">🎲</span>
                <div class="game-name">Кости</div>
                <div class="game-type">Игра</div>
            </button>
            <button class="game-card" onclick="go('bowling')">
                <div class="game-badge"><span class="fire">🔥</span> Популярное</div>
                <span class="game-emoji">🎳</span>
                <div class="game-name">Боулинг</div>
                <div class="game-type">Игра</div>
            </button>
            <button class="game-card" onclick="go('mines')">
                <div class="game-badge"><span class="fire">🔥</span> Популярное</div>
                <span class="game-emoji">💣</span>
                <div class="game-name">Мины</div>
                <div class="game-type">Игра</div>
            </button>
            <button class="game-card" onclick="go('football')">
                <div class="game-badge"><span class="fire">🔥</span> Популярное</div>
                <span class="game-emoji">⚽</span>
                <div class="game-name">Футбол</div>
                <div class="game-type">Игра</div>
            </button>
        </div>

        <!-- Мини-игры: 2 колонки -->
        <div class="mini-list">
            <button class="mini-item" onclick="go('keno')">
                <span class="ico">🎱</span> Кено <span class="arrow">›</span>
            </button>
            <button class="mini-item" onclick="go('hilo')">
                <span class="ico">🎰</span> Hi-Lo <span class="arrow">›</span>
            </button>
            <button class="mini-item" onclick="go('wheel')">
                <span class="ico">🎡</span> Wheel <span class="arrow">›</span>
            </button>
            <button class="mini-item" onclick="go('rb')">
                <span class="ico">🔵</span> R&B <span class="arrow">›</span>
            </button>
        </div>

        <!-- Эксклюзивные игры -->
        <div class="section-title"><span class="emoji">🌟</span> Эксклюзивные игры</div>
        <div class="games-row">
            <button class="game-card" onclick="go('crash')">
                <div class="game-badge fast">Fast</div>
                <span class="game-emoji">🚀</span>
                <div class="game-name">Краш</div>
                <div class="game-type">Игра</div>
            </button>
            <button class="game-card" onclick="go('roulette')">
                <div class="game-badge fast">Fast</div>
                <span class="game-emoji">🎡</span>
                <div class="game-name">Рулетка</div>
                <div class="game-type">Игра</div>
            </button>
            <button class="game-card" onclick="go('mines')">
                <div class="game-badge luck">Luck</div>
                <span class="game-emoji">💣</span>
                <div class="game-name">Мины</div>
                <div class="game-type">Игра</div>
            </button>
            <button class="game-card" onclick="go('tower')">
                <div class="game-badge luck">Luck</div>
                <span class="game-emoji">🏰</span>
                <div class="game-name">Башня</div>
                <div class="game-type">Игра</div>
            </button>
        </div>

        <!-- PvP -->
        <button class="wide-card" onclick="go('pvp')">
            <span class="ico">⚔️</span>
            <div class="info">
                <div class="title">PvP - Дуэль на Emoji играх</div>
                <div class="sub">Игры: Кости, Боулинг, Дартс, Баскетбол, Футбол и Слоты</div>
            </div>
            <span class="arrow">›</span>
        </button>

        <!-- Блэкджек -->
        <button class="wide-card" onclick="go('blackjack')">
            <span class="ico">🃏</span>
            <div class="info">
                <div class="title">Блэкджек</div>
                <div class="sub">Классическая карточная игра против дилера — набери 21 и не перебери</div>
            </div>
            <span class="arrow">›</span>
        </button>

        <!-- Emoji-игры (2 колонки) -->
        <div class="mini-list">
            <button class="mini-item" onclick="go('dice')">
                <span class="ico">🎲</span> Кости <span class="arrow">›</span>
            </button>
            <button class="mini-item" onclick="go('bowling')">
                <span class="ico">🎳</span> Боулинг <span class="arrow">›</span>
            </button>
        </div>
    </div>

    <!-- Экраны-заглушки для игр -->
    <div id="screen-crash" class="screen">
        <button class="back-btn" onclick="go('games')">← Назад</button>
        <h2 style="padding:20px 16px;">🚀 Краш</h2>
        <p style="padding:0 16px;color:#777;">Скоро здесь будет график.</p>
    </div>
    <div id="screen-mines" class="screen">
        <button class="back-btn" onclick="go('games')">← Назад</button>
        <h2 style="padding:20px 16px;">💣 Мины</h2>
        <p style="padding:0 16px;color:#777;">Поле 5×5 скоро.</p>
    </div>
    <div id="screen-roulette" class="screen">
        <button class="back-btn" onclick="go('games')">← Назад</button>
        <h2 style="padding:20px 16px;">🎡 Рулетка</h2>
        <p style="padding:0 16px;color:#777;">Колесо скоро.</p>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <button class="nav-btn" onclick="alert('Друзья — скоро')">👥</button>
        <button class="nav-btn" onclick="alert('Карта — скоро')">💳</button>
        <button class="nav-btn center" onclick="alert('Депозит через звёзды — скоро')">$</button>
        <button class="nav-btn" onclick="alert('История — скоро')">📋</button>
        <button class="nav-btn" onclick="alert('Избранное — скоро')">⭐</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe?.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('username').innerText = u.first_name || 'Игрок';
            document.getElementById('user-avatar').innerText = (u.first_name || 'P')[0].toUpperCase();
        }

        function go(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const el = document.getElementById('screen-' + id);
            if (el) { el.classList.add('active'); window.scrollTo(0, 0); }
            else { alert('Игра "' + id + '" — скоро!'); }
        }
    </script>
</body>
</html>
