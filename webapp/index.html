<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BERM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: #0d0d12;
            color: #e9e9ef;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding-bottom: 110px;
            overflow-x: hidden;
            letter-spacing: -0.4px;
        }

        /* ---------- ВЕРХ: баланс ---------- */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px 12px 18px;
        }
        .bal {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .coin {
            width: 26px; height: 26px;
            background: #d4a237;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: #1a1a1a;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25), 0 2px 0 #8a6a1f;
        }
        .me {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
        }
        .ava {
            width: 30px; height: 30px;
            background: #d4a237;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
            color: #1a1a1a;
            box-shadow: 0 2px 0 #8a6a1f;
        }

        /* ---------- ПОИСК ---------- */
        .search {
            display: flex;
            gap: 8px;
            padding: 0 18px 20px 18px;
        }
        .search input {
            flex: 1;
            background: #1a1a22;
            border: 1px solid #24242e;
            border-radius: 12px;
            padding: 12px 14px 12px 40px;
            color: #e9e9ef;
            font-size: 14px;
            font-family: inherit;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23555' stroke-width='2.5'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4-4'/></svg>");
            background-repeat: no-repeat;
            background-position: 13px center;
        }
        .search input::placeholder { color: #4a4a55; }
        .search button {
            background: #1a1a22;
            color: #888;
            border: 1px solid #24242e;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        /* ---------- ЗАГОЛОВКИ ---------- */
        .h {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 18px 14px 18px;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .h .ico { font-size: 20px; }

        /* ---------- ГОРИЗОНТАЛЬНЫЙ СКРОЛЛ ---------- */
        .row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 18px 24px 18px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }

        /* ---------- КАРТОЧКА ИГРЫ ---------- */
        .card {
            min-width: 108px;
            background: #16161e;
            border: 1px solid #22222c;
            border-radius: 18px;
            padding: 10px 8px 12px 8px;
            text-align: center;
            cursor: pointer;
            font-family: inherit;
            color: #e9e9ef;
            position: relative;
            flex-shrink: 0;
            box-shadow: 0 3px 0 #0a0a0e;
            transition: transform 0.08s, box-shadow 0.08s;
        }
        .card:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0a0a0e;
        }
        /* Микро-повороты, чтобы не выглядело шаблонно */
        .row .card:nth-child(3n+1) { transform: rotate(-0.7deg); }
        .row .card:nth-child(3n+2) { transform: rotate(0.4deg); }
        .row .card:nth-child(3n)   { transform: rotate(0deg); }

        .badge {
            position: absolute;
            top: 8px; left: 8px;
            background: #23232e;
            font-size: 9.5px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            gap: 3px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            color: #c9c9d4;
        }
        .badge .fire { color: #ff5c33; }

        .emo {
            display: block;
            font-size: 42px;
            line-height: 1;
            margin: 24px 0 10px 0;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
        }
        .name {
            font-size: 13.5px;
            font-weight: 800;
        }
        .type {
            font-size: 10.5px;
            color: #6a6a78;
            margin-top: 3px;
            font-weight: 600;
        }

        /* ---------- МИНИ-СПИСОК (2 колонки) ---------- */
        .mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            padding: 0 18px 22px 18px;
        }
        .mini button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #16161e;
            border: 1px solid #22222c;
            border-radius: 14px;
            padding: 13px 14px;
            color: #e9e9ef;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            box-shadow: 0 2px 0 #0a0a0e;
        }
        .mini button:active { transform: translateY(2px); box-shadow: none; }
        .mini .e { font-size: 22px; }
        .mini .ar { margin-left: auto; color: #4a4a55; font-size: 18px; font-weight: 900; }

        /* ---------- ШИРОКАЯ КАРТОЧКА ---------- */
        .wide {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #16161e;
            border: 1px solid #22222c;
            border-radius: 16px;
            padding: 14px 16px;
            margin: 0 18px 10px 18px;
            cursor: pointer;
            color: #e9e9ef;
            font-family: inherit;
            border-width: 1px;
            text-align: left;
            width: calc(100% - 36px);
            box-shadow: 0 2px 0 #0a0a0e;
        }
        .wide:active { transform: translateY(2px); box-shadow: none; }
        .wide .e { font-size: 28px; }
        .wide .txt { flex: 1; }
        .wide .t { font-size: 14.5px; font-weight: 800; margin-bottom: 3px; }
        .wide .s { font-size: 11.5px; color: #6a6a78; line-height: 1.35; }
        .wide .ar { color: #4a4a55; font-size: 18px; font-weight: 900; }

        /* ---------- НИЖНЕЕ МЕНЮ ---------- */
        .nav {
            position: fixed;
            bottom: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #16161e;
            border: 1px solid #22222c;
            border-radius: 26px;
            padding: 10px 6px;
            box-shadow: 0 6px 0 #06060a, 0 10px 24px rgba(0,0,0,0.5);
        }
        .nav button {
            background: none;
            border: none;
            color: #5a5a68;
            font-size: 20px;
            padding: 8px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav button.on { color: #e9e9ef; }
        .nav .mid {
            background: #d4a237;
            width: 52px; height: 52px;
            border-radius: 50%;
            color: #1a1a1a;
            font-size: 24px;
            font-weight: 900;
            margin-top: -24px;
            box-shadow: 0 4px 0 #8a6a1f, 0 8px 20px rgba(212, 162, 55, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav .mid:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a6a1f; }

        /* ---------- ЭКРАНЫ ---------- */
        .scr { display: none; }
        .scr.on { display: block; }
        .back {
            margin: 16px 18px;
            background: #16161e;
            color: #e9e9ef;
            border: 1px solid #22222c;
            padding: 11px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .ptitle {
            padding: 4px 18px 8px 18px;
            font-size: 24px;
            font-weight: 900;
        }
        .psub {
            padding: 0 18px 20px 18px;
            color: #6a6a78;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Верх -->
    <div class="top">
        <div class="bal">
            <span class="coin">$</span>
            <span id="bal">0</span>
        </div>
        <div class="me">
            <span id="name">—</span>
            <span class="ava" id="av">P</span>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="s-games" class="scr on">

        <div class="search">
            <input placeholder="Найти игру" />
            <button>Поиск</button>
        </div>

        <div class="h"><span class="ico">🔥</span> Популярные за 24 часа</div>
        <div class="row">
            <button class="card" onclick="go('dice')">
                <div class="badge"><span class="fire">🔥</span> Top</div>
                <span class="emo">🎲</span>
                <div class="name">Кости</div>
                <div class="type">Игра</div>
            </button>
            <button class="card" onclick="go('bowl')">
                <div class="badge"><span class="fire">🔥</span> Top</div>
                <span class="emo">🎳</span>
                <div class="name">Боулинг</div>
                <div class="type">Игра</div>
            </button>
            <button class="card" onclick="go('mines')">
                <div class="badge"><span class="fire">🔥</span> Top</div>
                <span class="emo">💣</span>
                <div class="name">Мины</div>
                <div class="type">Игра</div>
            </button>
            <button class="card" onclick="go('foot')">
                <div class="badge"><span class="fire">🔥</span> Top</div>
                <span class="emo">⚽</span>
                <div class="name">Футбол</div>
                <div class="type">Игра</div>
            </button>
        </div>

        <div class="mini">
            <button onclick="go('keno')"><span class="e">🎱</span> Кено <span class="ar">›</span></button>
            <button onclick="go('hilo')"><span class="e">🎰</span> Hi-Lo <span class="ar">›</span></button>
            <button onclick="go('wheel')"><span class="e">🎡</span> Wheel <span class="ar">›</span></button>
            <button onclick="go('rb')"><span class="e">🔵</span> R&B <span class="ar">›</span></button>
        </div>

        <div class="h"><span class="ico">🌟</span> Эксклюзивные игры</div>
        <div class="row">
            <button class="card" onclick="go('crash')">
                <div class="badge">Fast</div>
                <span class="emo">🚀</span>
                <div class="name">Краш</div>
                <div class="type">Игра</div>
            </button>
            <button class="card" onclick="go('roul')">
                <div class="badge">Fast</div>
                <span class="emo">🎡</span>
                <div class="name">Рулетка</div>
                <div class="type">Игра</div>
            </button>
            <button class="card" onclick="go('mines')">
                <div class="badge">Luck</div>
                <span class="emo">💣</span>
                <div class="name">Мины</div>
                <div class="type">Игра</div>
            </button>
            <button class="card" onclick="go('tower')">
                <div class="badge">Luck</div>
                <span class="emo">🏰</span>
                <div class="name">Башня</div>
                <div class="type">Игра</div>
            </button>
        </div>

        <button class="wide" onclick="go('pvp')">
            <span class="e">⚔️</span>
            <div class="txt">
                <div class="t">PvP — Дуэль на Emoji играх</div>
                <div class="s">Кости, Боулинг, Дартс, Баскетбол, Футбол, Слоты</div>
            </div>
            <span class="ar">›</span>
        </button>

        <button class="wide" onclick="go('black')">
            <span class="e">🃏</span>
            <div class="txt">
                <div class="t">Блэкджек</div>
                <div class="s">Классика против дилера — набери 21 и не перебери</div>
            </div>
            <span class="ar">›</span>
        </button>

        <div class="mini">
            <button onclick="go('dice')"><span class="e">🎲</span> Кости <span class="ar">›</span></button>
            <button onclick="go('bowl')"><span class="e">🎳</span> Боулинг <span class="ar">›</span></button>
        </div>
    </div>

    <!-- ЭКРАНЫ-ЗАГЛУШКИ -->
    <div id="s-crash" class="scr">
        <button class="back" onclick="go('games')">← Назад</button>
        <div class="ptitle">🚀 Краш</div>
        <div class="psub">Здесь будет график множителя.</div>
    </div>
    <div id="s-mines" class="scr">
        <button class="back" onclick="go('games')">← Назад</button>
        <div class="ptitle">💣 Мины</div>
        <div class="psub">Поле 5×5 скоро.</div>
    </div>
    <div id="s-roul" class="scr">
        <button class="back" onclick="go('games')">← Назад</button>
        <div class="ptitle">🎡 Рулетка</div>
        <div class="psub">Колесо скоро.</div>
    </div>
    <div id="s-tower" class="scr">
        <button class="back" onclick="go('games')">← Назад</button>
        <div class="ptitle">🏰 Башня</div>
        <div class="psub">Скоро.</div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="nav">
        <button onclick="soon('Друзья')">👥</button>
        <button onclick="soon('Карта')">💳</button>
        <button class="mid" onclick="soon('Депозит')">$</button>
        <button onclick="soon('История')">📋</button>
        <button onclick="soon('Избранное')">⭐</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe?.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('name').innerText = u.first_name || 'Игрок';
            document.getElementById('av').innerText = (u.first_name || 'P')[0].toUpperCase();
        }
        document.getElementById('bal').innerText = '3 045 810,31';

        function go(id) {
            document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
            const el = document.getElementById('s-' + id);
            if (el) { el.classList.add('on'); window.scrollTo(0,0); }
            else { alert('Игра "' + id + '" — скоро'); }
        }

        function soon(what) { alert(what + ' — скоро'); }
    </script>
</body>
</html>
